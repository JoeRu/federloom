# FederLoom config for the local federated peer (smoke test client).
# No ingest sources — this node only receives events via gossipsub.
federation_mode: federated
store:
  dir: /var/lib/federloom
enforce:
  backend: ipset
  set_name: federloom-client
  chain: INPUT
reputation:
  block_threshold: 1000
  unblock_threshold: 900
  half_life: 168h
  decay_interval: 1h
  rules_file: /etc/federloom/rules.yaml
observability:
  prometheus_addr: ":9101"
bootstrap_peers:
  - /dns4/federloom.jru.me/tcp/7700/p2p/12D3KooWBvpzbEBgcFbHrw3kEFjfdFB2AwimGMhMrVGQBHMpZNjD
