# FederLoom config for the WordPress production node.
# This file is merged with config.local.yaml at runtime.
# config.local.yaml is generated by bootstrap-wordpress.sh — do not commit.
federation_mode: federated
store:
  dir: /var/lib/federloom
enforce:
  backend: ipset
  set_name: federloom
  chain: INPUT
reputation:
  block_threshold: 75
  unblock_threshold: 60
  half_life: 168h
  decay_interval: 1h
  rules_file: /etc/federloom/rules.yaml
ingest:
  crowdsec:
    enabled: false          # enable after: cscli bouncers add federloom
    lapi_url: "http://172.21.0.3:8080"
    api_key: ""             # set in config.local.yaml — never commit
    poll_interval: 30s
    enable_decisions: true
    enable_alerts: true
observability:
  prometheus_addr: ":9101"
  sqlite_path: "metrics.db"
  sqlite_retention: "720h"   # 30 days
api:
  addr: ":9102"
  purpose: "web"
  taxonomy:
    web:
      - http-*
bootstrap_peers:
  - /ip4/167.233.115.41/tcp/7700/p2p/12D3KooWBvpzbEBgcFbHrw3kEFjfdFB2AwimGMhMrVGQBHMpZNjD  # honeypot relay
dnsbl:
  addr: ":5353"
  zone: "dnsbl.federloom.web."
  # min_score: 0   # defaults to reputation.block_threshold (75)
