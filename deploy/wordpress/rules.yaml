# SwarmGuard rules for the WordPress production node.
# Rules are evaluated top-to-bottom; first match wins.

# CrowdSec confirmed ban from local instance — block immediately.
- name: crowdsec-decision
  reason: crowdsec-decision
  min_corroboration: 1
  action: block

# CrowdSec alert corroborated by honeypot or a peer — high confidence.
- name: crowdsec-alert-corroborated
  reason: crowdsec-alert
  min_corroboration: 2
  action: block

# HTTP probing seen by 2+ reporters — likely scanner targeting WordPress.
- name: http-probe-consensus
  reason: http-probe
  min_corroboration: 2
  action: block

# SSH post-auth command reported by honeypot — attacker ran shell commands.
- name: honeypot-shell-exec
  reason: ssh-post-auth-command
  min_corroboration: 1
  action: block

# SSH auth success on honeypot — attacker authenticated.
- name: honeypot-auth-success
  reason: ssh-auth-success
  min_corroboration: 1
  action: block

# SSH burst — 15 events in 10 min (honeypot feeds this).
- name: ssh-brute-burst
  reason: ssh-auth-bruteforce
  min_burst: 15
  burst_window: 10m
  action: block

# Unknown CrowdSec scenario from a single source — watch only.
- name: crowdsec-alert-watch
  reason: crowdsec-alert
  min_corroboration: 1
  action: watch

# Score-based fallback — catches anything not matched above.
- name: score-fallback
  min_score: 75
  action: block
