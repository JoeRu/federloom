# FederLoom rules for the WordPress production node.
# Rules are evaluated top-to-bottom; first match wins.
# Reason patterns: exact string OR prefix wildcard ending in "*" (e.g. "http-*").

# CrowdSec confirmed HTTP/WordPress ban from local instance — block immediately.
# Covers crowdsecurity/http-*, crowdsecurity/http-sensitive-files, etc.
- name: crowdsec-http-ban
  reason: http-*
  min_corroboration: 1
  action: block

# CrowdSec WordPress-scanner ban (crowdsecurity/wordpress-scan etc.).
- name: crowdsec-wordpress-ban
  reason: wordpress-*
  min_corroboration: 1
  action: block

# HTTP probing seen by 2+ federation peers — scanner confirmed by swarm.
- name: http-probe-consensus
  reason: http-probe
  min_corroboration: 2
  action: block

# SSH post-auth command reported by honeypot — attacker ran shell commands.
- name: honeypot-shell-exec
  reason: ssh-post-auth-command
  min_corroboration: 1
  action: block

# SSH auth success on honeypot — attacker authenticated.
- name: honeypot-auth-success
  reason: ssh-auth-success
  min_corroboration: 1
  action: block

# SSH burst — 15 events in 10 min (honeypot feeds this).
- name: ssh-brute-burst
  reason: ssh-auth-bruteforce
  min_burst: 15
  burst_window: 10m
  action: block

# Score-based fallback — catches anything not matched above.
- name: score-fallback
  min_score: 75
  action: block
