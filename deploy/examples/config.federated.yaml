# Federated node: contributes to and imports from a trust domain (with discount).
federation_mode: federated
federation_subnet: "example-federation"  # home trust domain (spec §5.2)
reputation:
  block_threshold: 75                     # score at which an IP is blocked (spec §4.2)
trust:
  federation_discount: 0.5                # foreign consensus weight discount (spec §5.2)
resources:
  # Good-neighbour processing-rate budget (spec §11.5). 0 = off (default).
  # Above the budget the node sheds NETWORK-CONTRIBUTION work only — remote
  # gossip scoring, bridge re-emission, on-demand federated queries — while
  # local protection (own ingest → score → enforce) always runs.
  max_events_per_sec: 0
# Federation discovery (spec §14) — opt-out flags, both default true.
discovery:
  advertise: true
  discover: true
  # relay_list_path: ""  # leave empty to use the bundled relay list

# List well-known relay peers to connect to at startup.
# Peers are tried once on boot; the DHT routing table takes over after that.
# Update this list when a peer's node key rotates (key rotation = new peer ID).
bootstrap_peers: []
# Example:
#   - /ip4/1.2.3.4/tcp/7700/p2p/12D3KooW...
