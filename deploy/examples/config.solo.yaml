# Single node, no network participation. Local detection + enforcement only (MVP).
federation_mode: solo
enforce:
  backend: ipset          # ipset | nftables | crowdsec
score:
  block_threshold: 80     # local threshold; lists are aids only (spec Leitprinzip 7)
decay:
  half_life: 168h         # TODO: tune (spec problem D)
ingest:
  crowdsec:
    enabled: false          # set to true after: cscli bouncers add federloom
    lapi_url: "http://localhost:8080"
    api_key: ""             # paste bouncer key here — never commit; use config.local.yaml
    poll_interval: 30s
    enable_decisions: true
    enable_alerts: true
# Federation discovery (spec §14) — has no effect in solo mode (no transport).
# Uncomment and set federation_mode to enable once adding transport config.
# discovery:
#   advertise: true
#   discover: true

# Optional observability plane (disabled by default, spec §11.2).
# Uncomment to enable:
# observability:
#   prometheus_addr: ":9101"          # expose Prometheus /metrics
#   sqlite_path: "metrics.db"         # event history (relative to store.dir)
#   sqlite_retention: 360h            # prune rows older than 15 days
#   score_gauge_threshold: 0          # emit ip_score gauge for IPs above this; 0 = block_threshold/2
