# SwarmGuard config for the Mailcow production node.
# This file is merged with config.local.yaml at runtime.
# config.local.yaml is generated by bootstrap-mailcow.sh — do not commit.
federation_mode: federated
store:
  dir: /var/lib/swarmguard
enforce:
  backend: ipset
  set_name: swarmguard
  chain: INPUT
reputation:
  block_threshold: 75
  unblock_threshold: 60
  half_life: 168h
  decay_interval: 1h
  rules_file: /etc/swarmguard/rules.yaml
ingest:
  crowdsec:
    enabled: false          # enable after: cscli bouncers add swarmguard
    lapi_url: "http://127.0.0.1:8080"
    api_key: ""             # set in config.local.yaml — never commit
    poll_interval: 30s
    enable_decisions: true
    enable_alerts: true
observability:
  prometheus_addr: ":9101"
