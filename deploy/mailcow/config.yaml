# SwarmGuard config for the Mailcow production node.
# This file is merged with config.local.yaml at runtime.
# config.local.yaml is generated by bootstrap-mailcow.sh — do not commit.
federation_mode: federated
store:
  dir: /var/lib/swarmguard
enforce:
  backend: ipset
  set_name: swarmguard
  chain: INPUT
reputation:
  block_threshold: 75
  unblock_threshold: 60
  half_life: 168h
  decay_interval: 1h
  rules_file: /etc/swarmguard/rules.yaml
ingest:
  mailcow_logs:
    enabled: true
    postfix_container: mailcowdockerized-postfix-mailcow-1
    dovecot_container: mailcowdockerized-dovecot-mailcow-1
    poll_interval: 30s
  spamtrap:
    enabled: false          # enable after creating spamtrap mailboxes and writing IPs to log_file
    log_file: /var/log/swarmguard-spamtrap.log
    poll_interval: 5s
  crowdsec:
    enabled: false          # enable after: cscli bouncers add swarmguard
    lapi_url: "http://127.0.0.1:8080"
    api_key: ""             # set in config.local.yaml — never commit
    poll_interval: 30s
    enable_decisions: true
    enable_alerts: false    # alerts require machine auth; bouncer key only covers decisions
observability:
  prometheus_addr: ":9101"
api:
  addr: ":9102"
  purpose: "mail"
  taxonomy:
    mail:
      - smtp-*
      - imap-*
      - pop3-*
bootstrap_peers:
  - /ip4/167.233.115.41/tcp/7700/p2p/12D3KooWBvpzbEBgcFbHrw3kEFjfdFB2AwimGMhMrVGQBHMpZNjD  # honeypot relay
dnsbl:
  addr: ":5353"
  zone: "dnsbl.swarmguard.mail."
  # min_score: 0   # defaults to reputation.block_threshold (75)
