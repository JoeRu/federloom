# FederLoom config for a Mailcow node.
# Every value here is a local default — lists are aids, not law; override freely.
federation_mode: solo          # switch to "federated" to share/receive (see README)
store:
  dir: /var/lib/federloom
ingest:
  mailcow_logs:
    enabled: true
    postfix_container: mailcowdockerized-postfix-mailcow-1
    dovecot_container: mailcowdockerized-dovecot-mailcow-1
    poll_interval: 30s
  # spamtrap:
  #   enabled: false          # enable after creating spamtrap mailboxes and writing IPs to log_file
  #   log_file: /var/log/federloom-spamtrap.log
  #   poll_interval: 5s
  # crowdsec:
  #   enabled: false          # enable after: cscli bouncers add federloom
  #   lapi_url: "http://127.0.0.1:8080"
  #   api_key: ""             # set in config.local.yaml — never commit
  #   poll_interval: 30s
  #   enable_decisions: true
  #   enable_alerts: false    # alerts require machine auth; bouncer key only covers decisions
enforce:
  backend: ipset
  set_name: federloom
  chains: [INPUT, DOCKER-USER]
reputation:
  rules_file: /etc/federloom/rules.yaml
api:
  addr: "127.0.0.1:9102"       # local status API — keep it off public interfaces
  purpose: "mail"
  taxonomy:
    mail:
      - smtp-*
      - imap-*
      - pop3-*
# Join a federation: set federation_mode: federated and add peers, e.g.
# bootstrap_peers:
#   - /dns4/peer.example.org/tcp/7700/p2p/12D3KooW...
#
# Observability (Prometheus / SQLite history) and the embedded DNSBL are both
# opt-in and omitted here — see docs/config.md for `observability` and
# `dnsbl` sections.
