# FederLoom as a non-invasive Mailcow add-on.
#
# Pattern follows JoeRu/Mailcow-Crowdsec-Override: drop this into
# /opt/mailcow-dockerized/ — docker compose merges it automatically, no changes
# to Mailcow's own files, upgrade-safe. See examples/mailcow/README.md.
services:
  federloom:
    image: ghcr.io/joeru/federloom:latest   # built from deploy/docker/Dockerfile
    container_name: federloom
    restart: unless-stopped
    # Read Docker logs for ingest (read-only), like the CrowdSec override does.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./federloom/config.yaml:/etc/federloom/config.yaml:ro
      - ./federloom/rules.yaml:/etc/federloom/rules.yaml:ro
      - federloom-data:/var/lib/federloom
    # Enforcement happens on the host; the daemon needs net admin for ipset/nft.
    cap_add: [ NET_ADMIN, NET_RAW ]
    network_mode: host

volumes:
  federloom-data:
