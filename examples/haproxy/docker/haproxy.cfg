global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind :80
    # FederLoom deny list, refreshed by fetch-blocklist.sh (see README).
    acl blocked src -f /usr/local/etc/haproxy/acl/blocklist.acl
    http-request deny deny_status 403 if blocked
    default_backend app

backend app
    server whoami whoami:80
