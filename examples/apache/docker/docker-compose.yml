# Apache httpd protected by CrowdSec (docker log acquisition) + FederLoom
# (federated reputation + host-firewall enforcement). Attackers blocked in
# DOCKER-USER never reach the apache container.
services:
  apache:
    image: httpd:2.4
    container_name: federloom-apache
    restart: unless-stopped
    ports:
      - "8081:80"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: federloom-apache-crowdsec
    restart: unless-stopped
    environment:
      COLLECTIONS: "crowdsecurity/apache2"
      # Auto-registers a bouncer named "federloom" with this key.
      # CHANGE THE KEY if this host is shared; it must match api_key in config.yaml.
      BOUNCER_KEY_federloom: "federloom-example-key"
    ports:
      # LAPI, localhost only — never expose publicly. Published on host port
      # 18080 to avoid colliding with a host-installed CrowdSec that owns 8080.
      - "127.0.0.1:18080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read apache stdout logs
      - ./acquis.yaml:/etc/crowdsec/acquis.d/apache.yaml:ro
      - crowdsec-config:/etc/crowdsec
      - crowdsec-data:/var/lib/crowdsec/data
    depends_on: [apache]

  federloom:
    image: ghcr.io/joeru/federloom:latest
    container_name: federloom
    restart: unless-stopped
    cap_add: [NET_ADMIN, NET_RAW]
    network_mode: host          # enforce on the host firewall; reach LAPI via 127.0.0.1
    volumes:
      - ./config.yaml:/etc/federloom/config.yaml:ro
      - ./rules.yaml:/etc/federloom/rules.yaml:ro
      - federloom-data:/var/lib/federloom
    command: >
      --config /etc/federloom/config.yaml
    depends_on: [crowdsec]

volumes:
  crowdsec-config:
  crowdsec-data:
  federloom-data:
